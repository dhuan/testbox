name: Build & Test

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustup_toolchain: stable
          - os: macos-latest
            target: aarch64-apple-darwin
            rustup_toolchain: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rustup_toolchain }}

      - name: Cargo build
        run: cargo build

      - name: Set up mock
        run: |
          mkdir -p ~/bin
          GOBIN="$HOME/bin" go install github.com/dhuan/mock@v1.4.16
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/mock" version

      - name: E2E test
        run: make test
