[package]
name = "testbox"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "unstable-doc"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serde", "serialize"] }
rand = "0.10.2"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = "1.0.228"
serde_json = "1.0.150"
url = "2.5.8"
